<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contacts.css">
    <link rel="icon" type="png/img" href="web.png">
    <title>Contact</title>
</head>
<body>
    <div class="contact">
        <h1>Contact with us <br> <span class="red">Take information about Cars</span> <br> Deal with Us </h1>
    </div>
    <div class="inputed">
        <form class="form" id="contactForm"> 
            <input class="input" type="text" id="contactName" placeholder="Name">
            <input class="input" type="email" id="contactEmail" placeholder="E-Mail I.D.">
            <textarea class="textarea" id="contactText" placeholder="Enter message"></textarea>
            <button class="button" type="submit">Submit</button>
        </form>

    </div>
    
    <a class="btn-top" href="index.html"> BACK ↗ </a>
    <script src="contacts.js"></script>
</body>
</html>
